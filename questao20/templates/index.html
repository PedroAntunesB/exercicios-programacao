<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Tarefas</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <main class="container">
      <h1>Gerenciador de Tarefas</h1>
      <p>Cadastre e organize suas tarefas.</p>

      <section>
        <h2>Nova tarefa</h2>

        <form action="{{ url_for('criar') }}" method="POST">
          <input
            type="text"
            name="titulo"
            placeholder="Digite uma tarefa"
            required
          />
          <button type="submit">Adicionar</button>
        </form>
      </section>

      <section>
        <h2>Tarefas cadastradas</h2>

        {% if tarefas %} {% for tarefa in tarefas %}
        <article class="tarefa">
          <p>
            <strong>#{{ tarefa['id'] }}</strong>
            {{ tarefa['titulo'] }}
          </p>

          <form
            action="{{ url_for('atualizar', id=tarefa['id']) }}"
            method="POST"
          >
            <input
              type="text"
              name="titulo"
              value="{{ tarefa['titulo'] }}"
              required
            />
            <button type="submit">Alterar</button>
          </form>

          <form
            action="{{ url_for('excluir', id=tarefa['id']) }}"
            method="POST"
          >
            <button type="submit" class="excluir">Excluir</button>
          </form>
        </article>
        {% endfor %} {% else %}
        <p>Nenhuma tarefa cadastrada.</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
